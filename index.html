<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>창고 부품 바코드 / QR 입력</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    body {
      color: #fff;
      padding: 28px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 24px 0 10px;
      text-align: center;
      font-size: 30px;
    }

    #modeText {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    #message {
      text-align: center;
      color: #ddd;
      font-size: 17px;
      line-height: 1.55;
      margin-bottom: 30px;
    }

    .inputCard {
      background: #fff;
      color: #222;
      padding: 24px 20px;
      border-radius: 22px;
    }

    .label {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #barcodeInput {
      width: 100%;
      min-height: 70px;
      padding: 12px 16px;
      border: 3px solid #bbb;
      border-radius: 14px;
      font-size: 22px;
      font-weight: bold;
      outline: none;
      text-transform: none;
    }

    #barcodeInput:focus {
      border-color: #1976d2;
    }

    .button {
      display: block;
      width: 100%;
      min-height: 72px;
      margin-top: 16px;
      border: 0;
      border-radius: 17px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    #confirmButton {
      background: #1976d2;
      color: #fff;
    }

    #clearButton {
      background: #eee;
      color: #222;
    }

    #backButton {
      background: #ddd;
      color: #222;
      margin-top: 22px;
    }

    #statusBox {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 17px;
      background: #fff;
      color: #222;
      text-align: center;
      line-height: 1.55;
      word-break: break-all;
    }

    #statusTitle {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #statusValue {
      font-size: 18px;
      font-weight: bold;
    }

    .hint {
      margin-top: 14px;
      color: #666;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
  <div class="wrap">

    <h1>📦 바코드 / QR 번호 입력</h1>

    <div id="modeText">부품 확인</div>

    <div id="message">
      부품에 표시된 K번호를 입력하거나<br>
      QR에서 확인한 +F번호를 입력해주세요.
    </div>

    <div
  id="numberReader"
  style="display:none; margin-bottom:25px;"
>
  <div
    id="qrReader"
    style="width:100%; background:#000;"
  ></div>
</div>
    
    <div class="inputCard">

      <label class="label" for="barcodeInput">
        바코드 / QR 번호
      </label>

      <input
        id="barcodeInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="예: K917568500034993"
      >

      <button
        id="confirmButton"
        class="button"
        type="button"
        onclick="submitBarcode()"
      >
        확인
      </button>

      <button
        id="clearButton"
        class="button"
        type="button"
        onclick="clearInput()"
      >
        다시 입력
      </button>

      <div class="hint">
        K번호는 그대로 처리됩니다.<br>
        +F로 시작하는 회사 원본번호는 자동으로 K번호로 변환됩니다.
      </div>

    </div>

    <div id="statusBox">
      <div id="statusTitle"></div>
      <div id="statusValue"></div>
    </div>

    <button
      id="backButton"
      class="button"
      type="button"
      onclick="cancelScan()"
    >
      ← 창고관리로 돌아가기
    </button>

  </div>

  <script>
    const DEFAULT_RETURN_URL =
      "https://script.google.com/macros/s/AKfycbzz7fNk9x8N7NEll5wsNzjNKMiQ6qq3L-4lBaU3xT2JNaxE9LVgES8wNgW6_0DKKYHbrA/exec";

    const params =
      new URLSearchParams(window.location.search);

    const mode =
      params.get("mode") || "test";

    const employee =
      params.get("employee") || "";

    const suppliedReturnUrl =
      params.get("returnUrl") || "";

    const returnUrl =
      suppliedReturnUrl || DEFAULT_RETURN_URL;

    window.addEventListener("load", function () {
      setModeDisplay();
  
      if (mode === "number") {
    startNumberReader();
    return;
  }
      const input =
        document.getElementById("barcodeInput");

      input.focus();

      input.addEventListener(
        "keydown",
        function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            submitBarcode();
          }
        }
      );
    });

    function setModeDisplay() {
      const modeText =
        document.getElementById("modeText");

      if (mode === "out") {
  modeText.textContent = "📤 출고";
}
else if (mode === "in") {
  modeText.textContent = "📥 입고";
}
else if (mode === "scan") {
  modeText.textContent = "🔎 부품 확인";
}
else if (mode === "number") {
  modeText.textContent = "📷 번호 읽기";
}
else {
  modeText.textContent = "🧪 입력 테스트";
}
}
    function convertCompanyBarcode(rawBarcode) {
      const result =
        String(rawBarcode || "").trim();

      const map = {
        "0": "6",
        "1": "2",
        "2": "4",
        "3": "5",
        "4": "1",
        "5": "3",
        "6": "7",
        "7": "0",
        "8": "9",
        "9": "8"
      };

      if (result.startsWith("+F")) {
        const numbers =
          result.substring(2);

        let kCode = "K";

        for (
          let i = 0;
          i < numbers.length;
          i++
        ) {
          kCode +=
            map[numbers[i]]
            ?? numbers[i];
        }

        return kCode;
      }

      return result;
    }

    function submitBarcode() {
      const input =
        document.getElementById("barcodeInput");

      const raw =
        String(input.value || "").trim();

      if (!raw) {
        alert(
          "바코드 또는 QR 번호를 입력해주세요."
        );
        input.focus();
        return;
      }

      const converted =
        convertCompanyBarcode(raw);

      showStatus(
        "✅ 입력 완료",
        "입력: " +
        escapeHtml(raw) +
        "<br>처리번호: " +
        escapeHtml(converted)
      );

      if (
        mode === "scan" ||
        mode === "in" ||
        mode === "out"
      ) {
        setTimeout(
          function () {
            returnToWarehouse(converted);
          },
          450
        );
      }
    }

    function clearInput() {
      const input =
        document.getElementById("barcodeInput");

      input.value = "";

      document
        .getElementById("statusBox")
        .style.display = "none";

      input.focus();
    }

    function showStatus(title, value) {
      document
        .getElementById("statusTitle")
        .textContent = title;

      document
        .getElementById("statusValue")
        .innerHTML = value;

      document
        .getElementById("statusBox")
        .style.display = "block";
    }

    function returnToWarehouse(barcode) {
      const url =
        new URL(returnUrl);

      url.searchParams.set(
        "mode",
        mode
      );

      url.searchParams.set(
        "employee",
        employee
      );

      url.searchParams.set(
        "barcode",
        barcode
      );

      window.location.replace(
        url.toString()
      );
    }

    function cancelScan() {
      const url =
        new URL(returnUrl);

      if (employee) {
        url.searchParams.set(
          "employee",
          employee
        );
      }

      window.location.replace(
        url.toString()
      );
    }

    let numberQrReader = null;
let numberDetected = false;

async function startNumberReader() {

  document.getElementById("modeText").textContent =
    "📷 번호 읽기";

  document.getElementById("message").innerHTML =
    "보드의 QR 코드를 카메라에 보여주세요.<br>" +
    "QR을 읽으면 K번호로 자동 변환됩니다.";

  document.getElementById("numberReader").style.display =
    "block";

  document.querySelector(".inputCard").style.display =
    "none";

  numberDetected = false;

  try {

    numberQrReader =
      new Html5Qrcode("qrReader");

    await numberQrReader.start(
      {
        facingMode: "environment"
      },
      {
        fps: 20,
qrbox: function(viewfinderWidth, viewfinderHeight) {
  const size = Math.floor(
    Math.min(viewfinderWidth, viewfinderHeight) * 0.65
  );

  return {
    width: size,
    height: size
  };
}
      },

      async function(decodedText) {

        if (numberDetected) {
          return;
        }

        numberDetected = true;

        const raw =
          String(decodedText || "").trim();

        const barcode =
          convertCompanyBarcode(raw);

        try {
          await numberQrReader.stop();
          await numberQrReader.clear();
        } catch (e) {
        }

        const correct = confirm(
          "인식한 번호\n\n" +
          barcode +
          "\n\n이 번호가 맞습니까?"
        );

        if (!correct) {
          numberDetected = false;
          startNumberReader();
          return;
        }

        try {

          await navigator.clipboard.writeText(barcode);

          alert(
            "✅ 번호가 복사되었습니다.\n\n" +
            barcode +
            "\n\n창고관리로 돌아가서 붙여넣기 하세요."
          );

        } catch (e) {

          prompt(
            "아래 번호를 복사해주세요.",
            barcode
          );

        }

        cancelScan();
      },

      function(errorMessage) {
        // QR을 찾을 때까지 카메라 유지
      }
    );

  } catch (error) {

    alert(
      "카메라 시작 오류\n\n" +
      (error && error.message
        ? error.message
        : String(error))
    );
  }
}
    
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

</body>
</html>
