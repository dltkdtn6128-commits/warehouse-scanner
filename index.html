<html lang="ko">
<head>

  <title>창고 부품 강력 인식 스캐너</title>

  <style>

  /* 최종 현장 버전: 자동 실시간 스캔 UI 숨김 */
  #reader, #cameraArea, #scanArea, .camera-area, .scan-area { display:none !important; }
</style>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.1/dist/iife/reader/index.js"></script>

  </head>

<body>
<div class="wrap">
  <h1>📷 바코드 / QR 강력 인식</h1>
  <div id="modeText">부품 확인</div>

  <div id="message">
    현장용 QR 전용 인식입니다.<br>
    <b>촬영해서 강력 인식</b>으로 ZXing-C++ WASM 엔진이 QR만 읽습니다.
  </div>

  <div id="reader"></div>

  <button id="photoButton" class="button" type="button" onclick="choosePhoto()">
    📸 촬영해서 강력 인식
  </button>

  <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">

  <button id="manualButton" class="button" type="button" onclick="openManual()">
    ⌨️ 바코드 / QR 직접 입력
  </button>

  <div class="inputCard" id="inputCard">
    <input
      id="barcodeInput"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      placeholder="예: K917568500034993 또는 +F..."
    >
    <button id="confirmButton" class="button" type="button" onclick="submitManual()">확인</button>
    <button id="closeManualButton" class="button" type="button" onclick="closeManual()">닫기</button>
  </div>

  <div id="statusBox">
    <div id="statusTitle"></div>
    <div id="statusValue"></div>
  </div>

  <div class="small"><b>ZXing-C++ WASM · 보드등록 바코드 강화 v2</b><br>
    QR 원본번호가 +F로 시작하면 기존 회사 규칙대로 K번호로 자동 변환합니다.<br>
    OCR 결과는 자동 확정하지 않고 반드시 번호 확인 후 처리합니다.
  </div>

  <button id="backButton" class="button" type="button" onclick="cancelScan()">
    ← 창고관리로 돌아가기
  </button>
</div>

<div id="busy">사진을 분석하고 있습니다.<br>QR → 이미지 보정 → 문자 인식 순서로 확인합니다.</div>

<script>
const DEFAULT_RETURN_URL =
  "https://script.google.com/macros/s/AKfycbzz7fNk9x8N7NEll5wsNzjNKMiQ6qq3L-4lBaU3xT2JNaxE9LVgES8wNgW6_0DKKYHbrA/exec";

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode") || "test";
const employee = params.get("employee") || "";
const suppliedReturnUrl = params.get("returnUrl") || "";
const returnUrl = suppliedReturnUrl || DEFAULT_RETURN_URL;

let liveScanner = null;
let detected = false;
let busy = false;

window.addEventListener("load", async function () {
  setModeDisplay();

  const input = document.getElementById("barcodeInput");
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      submitManual();
    }
  });

  document.getElementById("photoInput").addEventListener("change", async function (event) {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (file) await analyzePhoto(file);
  });

  await startLiveScanner();
});

function setModeDisplay() {
  const el = document.getElementById("modeText");
  if (mode === "out") el.textContent = "📤 출고";
  else if (mode === "in") el.textContent = "📥 입고";
  else if (mode === "scan") el.textContent = "🔎 부품 확인";
  else if (mode === "number") el.textContent = "📷 번호 읽기";
  else el.textContent = "🧪 스캐너 테스트";
}

function convertCompanyBarcode(rawBarcode) {
  const result = String(rawBarcode || "").trim().toUpperCase();

  const map = {
    "0": "6", "1": "2", "2": "4", "3": "5", "4": "1",
    "5": "3", "6": "7", "7": "0", "8": "9", "9": "8"
  };

  if (result.startsWith("+F")) {
    const numbers = result.substring(2);
    let kCode = "K";
    for (let i = 0; i < numbers.length; i++) {
      kCode += map[numbers[i]] ?? numbers[i];
    }
    return kCode;
  }
  return result;
}

function normalizeRaw(value) {
  return String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .replace(/[‐‑‒–—]/g, "-")
    .toUpperCase();
}

function looksUseful(value) {
  const s = normalizeRaw(value);
  return s.startsWith("+F") || /^K[0-9]{8,30}$/.test(s) || /^[0-9]{10,30}$/.test(s);
}

async function startLiveScanner() {
  if (busy || detected) return;

  try {
    liveScanner = new Html5Qrcode("reader");

    await liveScanner.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: function(w, h) {
          return {
            width: Math.floor(w * 0.88),
            height: Math.floor(Math.min(h * 0.55, w * 0.60))
          };
        },
        aspectRatio: 1.333333
      },
      async function(decodedText) {
        if (detected || busy) return;
        const raw = normalizeRaw(decodedText);
        if (!raw) return;
        detected = true;
        await stopLiveScanner();
        await acceptDetected(raw, "자동 QR 인식");
      },
      function() {}
    );
  } catch (e) {
    showStatus(
      "카메라 자동 인식 시작 실패",
      "촬영해서 강력 인식 또는 직접 입력을 사용해주세요."
    );
  }
}

async function stopLiveScanner() {
  if (!liveScanner) return;
  try { await liveScanner.stop(); } catch (e) {}
  try { await liveScanner.clear(); } catch (e) {}
  liveScanner = null;
}

function choosePhoto() {
  if (busy) return;
  document.getElementById("photoInput").click();
}

async function analyzePhoto(file) {
  if (busy) return;
  busy = true;
  detected = false;
  setBusy(true);
  await stopLiveScanner();

  try {
    // 입고/출고/보드등록 모두 QR + 일반 1D/2D 바코드를 허용.
    // 기존 보드등록 강화 로직을 세 메뉴에서 공통으로 사용한다.
    const strongBarcodeMode = (mode === "number" || mode === "in" || mode === "out");
    const opts = {
      formats: strongBarcodeMode
        ? ["QRCode", "Code128", "Code39", "Code93", "Codabar",
           "EAN13", "EAN8", "UPCA", "UPCE", "ITF",
           "DataMatrix", "PDF417", "Aztec"]
        : ["QRCode"],
      tryHarder: true,
      tryRotate: true,
      tryInvert: true,
      maxNumberOfSymbols: 1
    };

    // 1) 성공한 테스트와 동일하게 촬영 원본 파일을 ZXing-C++ WASM으로 먼저 분석
    let results = await ZXingWASM.readBarcodes(file, opts);
    if (results && results.length && results[0].text) {
      setBusy(false);
      busy = false;
      await acceptDetected(results[0].text.trim(), "ZXing-C++ QR 인식");
      return;
    }

    // 2) 원본이 실패할 때만 휴대폰 사진 크기를 안정적으로 줄여 한 번 더 시도
    const source = await loadImageData(file);
    results = await ZXingWASM.readBarcodes(source.data, opts);
    if (results && results.length && results[0].text) {
      setBusy(false);
      busy = false;
      await acceptDetected(results[0].text.trim(), "ZXing-C++ QR 인식");
      return;
    }

    // 3) QR 전용 모드에서는 기존 성공한 QR 흐름 그대로 유지
    if (!strongBarcodeMode) {
      const crop = makeZxingCenterCrop(source, 0.82, 1.8);
      results = await ZXingWASM.readBarcodes(crop, opts);
      if (results && results.length && results[0].text) {
        setBusy(false);
        busy = false;
        await acceptDetected(results[0].text.trim(), "ZXing-C++ 확대 QR 인식");
        return;
      }
    }

    // 4) 입고/출고/보드등록 공통 강화:
    // 일반 1D/2D 바코드는 길고 좁거나 세로로 붙어 있는 경우가 많으므로
    // 0/90/180/270도 회전 + 전체 확대 + 중앙의 가로/세로 긴 영역을 빠르게 재시도
    if (strongBarcodeMode) {
      const boardCandidates = makeBoardBarcodeCandidates(source);

      for (let i = 0; i < boardCandidates.length; i++) {
        results = await ZXingWASM.readBarcodes(boardCandidates[i], opts);
        if (results && results.length && results[0].text) {
          setBusy(false);
          busy = false;
          await acceptDetected(results[0].text.trim(), "ZXing-C++ 강력 바코드 인식");
          return;
        }
        if (i === 3) await new Promise(r => setTimeout(r, 0));
      }
    }

    setBusy(false);
    busy = false;
    detected = false;
    alert("바코드 / QR을 인식하지 못했습니다.\n\n코드가 사진 안에 잘 보이도록 다시 촬영해주세요.");

  } catch (e) {
    setBusy(false);
    busy = false;
    detected = false;
    alert("QR 분석 중 오류가 발생했습니다.\n\n" +
      (e && e.message ? e.message : String(e)));
  }
}

function makeBoardBarcodeCandidates(source) {
  const out = [];

  // 원본을 1.6배 확대: 작은 1D 바의 폭을 확보
  out.push(scaleCanvasImageData(source.canvas, 1.6));

  // 세로 라벨 / 뒤집힌 라벨 대응
  out.push(rotateCanvasImageData(source.canvas, 90, 1.45));
  out.push(rotateCanvasImageData(source.canvas, 270, 1.45));
  out.push(rotateCanvasImageData(source.canvas, 180, 1.45));

  // 길고 좁은 바코드 라벨 대응: 중앙 가로 띠 / 세로 띠를 각각 확대
  out.push(cropRectImageData(source.canvas, 0.05, 0.25, 0.90, 0.50, 2.0));
  out.push(cropRectImageData(source.canvas, 0.25, 0.05, 0.50, 0.90, 2.0));

  // 중앙보다 약간 좌/우 또는 위/아래에 붙은 라벨 대응
  out.push(cropRectImageData(source.canvas, 0.00, 0.15, 0.72, 0.70, 1.8));
  out.push(cropRectImageData(source.canvas, 0.28, 0.15, 0.72, 0.70, 1.8));

  return out;
}

function scaleCanvasImageData(sourceCanvas, scale) {
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(sourceCanvas.width * scale));
  canvas.height = Math.max(1, Math.floor(sourceCanvas.height * scale));
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(sourceCanvas, 0, 0, canvas.width, canvas.height);
  return ctx.getImageData(0, 0, canvas.width, canvas.height);
}

function rotateCanvasImageData(sourceCanvas, deg, scale) {
  const rad = deg * Math.PI / 180;
  const swap = (deg % 180 !== 0);
  const baseW = swap ? sourceCanvas.height : sourceCanvas.width;
  const baseH = swap ? sourceCanvas.width : sourceCanvas.height;

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(baseW * scale));
  canvas.height = Math.max(1, Math.floor(baseH * scale));
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rad);
  ctx.scale(scale, scale);
  ctx.drawImage(sourceCanvas, -sourceCanvas.width / 2, -sourceCanvas.height / 2);

  return ctx.getImageData(0, 0, canvas.width, canvas.height);
}

function cropRectImageData(sourceCanvas, rx, ry, rw, rh, scale) {
  const sx = Math.max(0, Math.floor(sourceCanvas.width * rx));
  const sy = Math.max(0, Math.floor(sourceCanvas.height * ry));
  const sw = Math.max(1, Math.floor(sourceCanvas.width * rw));
  const sh = Math.max(1, Math.floor(sourceCanvas.height * rh));

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(sw * scale));
  canvas.height = Math.max(1, Math.floor(sh * scale));
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  return ctx.getImageData(0, 0, canvas.width, canvas.height);
}

function makeZxingCenterCrop(source, ratio, scale) {
  const sw = Math.floor(source.canvas.width * ratio);
  const sh = Math.floor(source.canvas.height * ratio);
  const sx = Math.floor((source.canvas.width - sw) / 2);
  const sy = Math.floor((source.canvas.height - sh) / 2);

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(sw * scale));
  canvas.height = Math.max(1, Math.floor(sh * scale));

  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(source.canvas, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  return ctx.getImageData(0, 0, canvas.width, canvas.height);
}
async function tryHtml5File(file) {
  const id = "tempFileQr_" + Date.now();
  const temp = document.createElement("div");
  temp.id = id;
  temp.style.display = "none";
  document.body.appendChild(temp);

  const scanner = new Html5Qrcode(id);
  try {
    const text = await scanner.scanFile(file, true);
    try { await scanner.clear(); } catch (e) {}
    temp.remove();
    return normalizeRaw(text);
  } catch (e) {
    try { await scanner.clear(); } catch (x) {}
    temp.remove();
    return "";
  }
}

function loadImageData(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);

    img.onload = function() {
      try {
        // Limit huge phone photos to keep processing stable.
        const maxSide = 1800;
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h);

        URL.revokeObjectURL(objectUrl);
        resolve({ canvas, ctx, data, width: w, height: h });
      } catch (e) {
        URL.revokeObjectURL(objectUrl);
        reject(e);
      }
    };

    img.onerror = function() {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("사진을 열 수 없습니다."));
    };

    img.src = objectUrl;
  });
}

async function tryBarcodeDetector(canvas) {
  if (!("BarcodeDetector" in window)) return "";
  try {
    const formats = await BarcodeDetector.getSupportedFormats();
    if (!formats.includes("qr_code")) return "";
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    const results = await detector.detect(canvas);
    if (results && results.length) {
      return normalizeRaw(results[0].rawValue || "");
    }
  } catch (e) {}
  return "";
}

function tryJsQr(imageData, width, height) {
  try {
    const result = jsQR(imageData.data, width, height, {
      inversionAttempts: "attemptBoth"
    });
    return result && result.data ? normalizeRaw(result.data) : "";
  } catch (e) {
    return "";
  }
}

function buildRobustVariants(source) {
  const gray = toGray(source.data);
  const stretched = contrastStretch(gray);
  const blurred = gaussianBlur3x3(stretched, source.width, source.height);
  const sharpened = unsharpMask(stretched, blurred, 1.8, 0.8);
  const binary31 = adaptiveThreshold(sharpened, source.width, source.height, 31, 5);
  const binary51 = adaptiveThreshold(sharpened, source.width, source.height, 51, 7);

  return [
    makeGrayVariant(stretched, source.width, source.height),
    makeGrayVariant(sharpened, source.width, source.height),
    makeGrayVariant(binary31, source.width, source.height),
    makeGrayVariant(binary51, source.width, source.height)
  ];
}

function toGray(imageData) {
  const src = imageData.data;
  const gray = new Uint8ClampedArray(imageData.width * imageData.height);
  for (let i = 0, p = 0; i < src.length; i += 4, p++) {
    gray[p] = Math.round(0.299 * src[i] + 0.587 * src[i+1] + 0.114 * src[i+2]);
  }
  return gray;
}

function contrastStretch(gray) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < gray.length; i++) hist[gray[i]]++;

  const total = gray.length;
  const lowTarget = total * 0.01;
  const highTarget = total * 0.99;

  let acc = 0, low = 0, high = 255;
  for (let i = 0; i < 256; i++) {
    acc += hist[i];
    if (acc >= lowTarget) { low = i; break; }
  }
  acc = 0;
  for (let i = 0; i < 256; i++) {
    acc += hist[i];
    if (acc >= highTarget) { high = i; break; }
  }

  if (high <= low) return new Uint8ClampedArray(gray);

  const out = new Uint8ClampedArray(gray.length);
  const scale = 255 / (high - low);
  for (let i = 0; i < gray.length; i++) {
    out[i] = Math.max(0, Math.min(255, Math.round((gray[i] - low) * scale)));
  }
  return out;
}

// 3x3 Gaussian kernel:
// 1 2 1
// 2 4 2  / 16
// 1 2 1
function gaussianBlur3x3(src, w, h) {
  const out = new Uint8ClampedArray(src.length);
  for (let y = 0; y < h; y++) {
    const ym = Math.max(0, y - 1);
    const yp = Math.min(h - 1, y + 1);
    for (let x = 0; x < w; x++) {
      const xm = Math.max(0, x - 1);
      const xp = Math.min(w - 1, x + 1);
      const sum =
        src[ym*w+xm] + 2*src[ym*w+x] + src[ym*w+xp] +
        2*src[y*w+xm] + 4*src[y*w+x] + 2*src[y*w+xp] +
        src[yp*w+xm] + 2*src[yp*w+x] + src[yp*w+xp];
      out[y*w+x] = Math.round(sum / 16);
    }
  }
  return out;
}

function unsharpMask(original, blurred, originalWeight, blurWeight) {
  const out = new Uint8ClampedArray(original.length);
  for (let i = 0; i < original.length; i++) {
    const v = originalWeight * original[i] - blurWeight * blurred[i];
    out[i] = Math.max(0, Math.min(255, Math.round(v)));
  }
  return out;
}

// Adaptive mean threshold using an integral image.
// This is the browser equivalent of the local-shadow compensation idea behind
// cv2.adaptiveThreshold, without depending on a fragile OpenCV.js build.
function adaptiveThreshold(gray, w, h, blockSize, C) {
  const r = Math.floor(blockSize / 2);
  const integral = new Float64Array((w + 1) * (h + 1));

  for (let y = 1; y <= h; y++) {
    let rowSum = 0;
    for (let x = 1; x <= w; x++) {
      rowSum += gray[(y - 1) * w + (x - 1)];
      integral[y * (w + 1) + x] =
        integral[(y - 1) * (w + 1) + x] + rowSum;
    }
  }

  const out = new Uint8ClampedArray(gray.length);

  for (let y = 0; y < h; y++) {
    const y1 = Math.max(0, y - r);
    const y2 = Math.min(h - 1, y + r);

    for (let x = 0; x < w; x++) {
      const x1 = Math.max(0, x - r);
      const x2 = Math.min(w - 1, x + r);

      const A = integral[y1 * (w + 1) + x1];
      const B = integral[y1 * (w + 1) + (x2 + 1)];
      const D = integral[(y2 + 1) * (w + 1) + x1];
      const E = integral[(y2 + 1) * (w + 1) + (x2 + 1)];

      const area = (x2 - x1 + 1) * (y2 - y1 + 1);
      const mean = (E - B - D + A) / area;
      const v = gray[y * w + x];

      out[y * w + x] = v > (mean - C) ? 255 : 0;
    }
  }

  return out;
}

function makeGrayVariant(gray, w, h) {
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const img = ctx.createImageData(w, h);

  for (let i = 0, p = 0; p < gray.length; p++, i += 4) {
    const v = gray[p];
    img.data[i] = v;
    img.data[i+1] = v;
    img.data[i+2] = v;
    img.data[i+3] = 255;
  }

  ctx.putImageData(img, 0, 0);
  return { canvas, data: img, width: w, height: h };
}

async function runOcrCandidates(originalCanvas, variants) {
  const targets = [originalCanvas];
  if (variants[0]) targets.push(variants[0].canvas);
  if (variants[1]) targets.push(variants[1].canvas);

  const found = new Set();

  for (const canvas of targets) {
    try {
      const result = await Tesseract.recognize(canvas, "eng", {
        logger: function() {}
      });

      const text = String(result.data && result.data.text ? result.data.text : "")
        .toUpperCase()
        .replace(/[ \t\r\n]/g, "");

      const kMatches = text.match(/K[0-9]{8,30}/g) || [];
      kMatches.forEach(v => found.add(v));

      // OCR may confuse K with other characters. Long digit sequences are shown
      // as K candidates, but still require explicit user confirmation.
      const digitMatches = text.match(/[0-9]{12,30}/g) || [];
      digitMatches.forEach(v => found.add("K" + v));

    } catch (e) {}
  }

  return Array.from(found).slice(0, 8);
}

async function askOcrCandidate(candidates) {
  let chosen = "";

  if (candidates.length === 1) {
    const candidate = candidates[0];
    const ok = confirm(
      "QR은 읽지 못했지만 인쇄된 번호를 문자로 인식했습니다.\n\n" +
      candidate +
      "\n\n⚠️ 흐린 숫자는 3/6/8/9 등이 틀릴 수 있습니다.\n" +
      "보드에 적힌 번호와 직접 비교해서 맞을 때만 확인을 눌러주세요."
    );
    if (ok) chosen = candidate;
  } else {
    const answer = prompt(
      "문자 인식 후보가 여러 개입니다.\n" +
      "보드에 적힌 번호와 비교해서 정확한 번호를 입력해주세요.\n\n" +
      candidates.map((v, i) => (i + 1) + ". " + v).join("\n"),
      candidates[0]
    );
    if (answer) chosen = normalizeRaw(answer);
  }

  if (!chosen) {
    detected = false;
    await restartLive();
    return;
  }

  await acceptDetected(chosen, "OCR 보조 인식");
}

async function acceptDetected(rawValue, source) {
  const raw = normalizeRaw(rawValue);
  if (!raw) {
    detected = false;
    await restartLive();
    return;
  }

  const converted = convertCompanyBarcode(raw);

  // Live/photo QR is also confirmed before an inventory action.
  const ok = confirm(
    source + "\n\n" +
    "인식 번호: " + raw + "\n" +
    "처리 번호: " + converted + "\n\n" +
    "이 번호가 맞습니까?"
  );

  if (!ok) {
    detected = false;
    await restartLive();
    return;
  }

  // 인식이 확정되면 모든 모드에서 K번호 자동 복사 시도
  let copied = false;
  try {
    await navigator.clipboard.writeText(converted);
    copied = true;
  } catch (e) {
    // 일부 모바일 브라우저에서는 클립보드 권한 때문에 실패할 수 있음.
    // 이 경우 아래 상태창에 번호를 그대로 표시해 수동 복사도 가능하게 유지.
  }

  showStatus(
    copied ? "✅ 인식 완료 · 번호 자동복사됨" : "✅ 인식 완료",
    escapeHtml(converted)
  );

  if (mode === "scan" || mode === "in" || mode === "out") {
    setTimeout(function() {
      returnToWarehouse(converted);
    }, 300);
    return;
  }

  if (mode === "number") {
    if (copied) {
      alert("✅ 번호가 자동으로 복사되었습니다.\n\n" + converted);
    } else {
      prompt("자동 복사가 차단되었습니다. 아래 번호를 복사해주세요.", converted);
    }
    cancelScan();
    return;
  }

  // test mode: keep result visible
  document.getElementById("barcodeInput").value = converted;
  detected = false;
}

function openManual() {
  document.getElementById("inputCard").style.display = "block";
  document.getElementById("barcodeInput").focus();
}

function closeManual() {
  document.getElementById("inputCard").style.display = "none";
}

async function submitManual() {
  const input = document.getElementById("barcodeInput");
  const raw = normalizeRaw(input.value);

  if (!raw) {
    alert("바코드 또는 QR 번호를 입력해주세요.");
    input.focus();
    return;
  }

  await stopLiveScanner();
  await acceptDetected(raw, "직접 입력");
}

function showStatus(title, value) {
  document.getElementById("statusTitle").textContent = title;
  document.getElementById("statusValue").innerHTML = value;
  document.getElementById("statusBox").style.display = "block";
}

function returnToWarehouse(barcode) {
  const url = new URL(returnUrl);
  url.searchParams.set("mode", mode);
  url.searchParams.set("employee", employee);
  url.searchParams.set("barcode", barcode);
  window.location.replace(url.toString());
}

function cancelScan() {
  const url = new URL(returnUrl);
  if (employee) url.searchParams.set("employee", employee);
  window.location.replace(url.toString());
}

async function restartLive() {
  if (mode === "test") return;
  await new Promise(r => setTimeout(r, 250));
  await startLiveScanner();
}

function setBusy(on) {
  document.getElementById("busy").style.display = on ? "flex" : "none";
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
