<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>창고 부품 바코드 / QR 입력</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    body {
      color: #fff;
      padding: 24px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 18px 0 8px;
      text-align: center;
      font-size: 28px;
    }

    #modeText {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #message {
      text-align: center;
      font-size: 17px;
      line-height: 1.55;
      color: #ddd;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      width: 100%;
      min-height: 72px;
      margin: 12px 0;
      border: 0;
      border-radius: 18px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    #photoButton {
      background: #ff9800;
      color: #fff;
    }

    #manualButton {
      background: #fff;
      color: #222;
    }

    #backButton {
      background: #ddd;
      color: #222;
    }

    #statusBox {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border-radius: 16px;
      background: #fff;
      color: #222;
      text-align: center;
      line-height: 1.55;
      word-break: break-all;
    }

    #statusTitle {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #statusValue {
      font-size: 18px;
      font-weight: bold;
    }

    #workCanvas,
    #photoReader {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>📦 바코드 / QR 입력</h1>

    <div id="modeText">부품 바코드 확인</div>

    <div id="message">
      촬영해서 스캔하거나<br>
      바코드 / QR 번호를 직접 입력해주세요.
    </div>

    <button id="photoButton" class="button" type="button"
      onclick="document.getElementById('photoInput').click()">
      📸 촬영으로 바코드 / QR 스캔
    </button>

    <input id="photoInput" type="file"
      accept="image/*"
      capture="environment"
      style="display:none"
      onchange="scanPhoto(this.files[0])">

    <button id="manualButton" class="button" type="button" onclick="manualInput()">
      ⌨️ 바코드 / QR 직접 입력
    </button>

    <button id="backButton" class="button" type="button" onclick="cancelScan()">
      ← 창고관리로 돌아가기
    </button>

    <div id="statusBox">
      <div id="statusTitle"></div>
      <div id="statusValue"></div>
    </div>

    <canvas id="workCanvas"></canvas>
    <div id="photoReader"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const DEFAULT_RETURN_URL =
      "https://script.google.com/macros/s/AKfycbzz7fNk9x8N7NEll5wsNzjNKMiQ6qq3L-4lBaU3xT2JNaxE9LVgES8wNgW6_0DKKYHbrA/exec";

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") || "test";
    const employee = params.get("employee") || "";
    const suppliedReturnUrl = params.get("returnUrl") || "";
    const returnUrl = suppliedReturnUrl || DEFAULT_RETURN_URL;

    window.addEventListener("load", setModeDisplay);

    function setModeDisplay() {
      const modeText = document.getElementById("modeText");

      if (mode === "out") {
        modeText.textContent = "📤 출고";
      } else if (mode === "in") {
        modeText.textContent = "📥 입고";
      } else if (mode === "scan") {
        modeText.textContent = "🔎 부품 확인";
      } else {
        modeText.textContent = "🧪 스캔 테스트";
      }
    }

    function convertCompanyBarcode(rawBarcode) {
      const result = String(rawBarcode || "").trim();

      const map = {
        "0": "6",
        "1": "2",
        "2": "4",
        "3": "5",
        "4": "1",
        "5": "3",
        "6": "7",
        "7": "0",
        "8": "9",
        "9": "8"
      };

      if (result.startsWith("+F")) {
        const numbers = result.substring(2);
        let kCode = "K";

        for (let i = 0; i < numbers.length; i++) {
          kCode += map[numbers[i]] ?? numbers[i];
        }

        return kCode;
      }

      return result;
    }

    function finishWithRawValue(rawValue) {
      const raw = String(rawValue || "").trim();

      if (!raw) {
        showStatus("⚠️ 인식 실패", "읽은 값이 없습니다.");
        return;
      }

      const converted = convertCompanyBarcode(raw);

      showStatus(
        "✅ 인식 완료",
        "원본: " + escapeHtml(raw) +
        "<br>변환: " + escapeHtml(converted)
      );

      if (mode === "scan" || mode === "in" || mode === "out") {
        setTimeout(function () {
          returnToWarehouse(converted);
        }, 650);
      }
    }

    async function scanPhoto(file) {
      if (!file) return;

      const input = document.getElementById("photoInput");
      const message = document.getElementById("message");

      message.innerHTML =
        "📸 사진에서 바코드 / QR을 찾고 있습니다...";

      hideStatus();

      try {
        const image = await loadImageFromFile(file);

        let decoded = "";

        // 1차: 원본 전체 사진을 브라우저 기본 판독기로 확인
        decoded = await detectWithBarcodeDetector(image);

        // 2차: html5-qrcode로 원본 파일 확인
        if (!decoded) {
          decoded = await detectOriginalWithHtml5QrCode(file);
        }

        // 3차: 사진을 여러 영역으로 잘라 확대/보정한 뒤 반복 판독
        if (!decoded) {
          decoded = await detectFromCrops(image);
        }

        if (!decoded) {
          throw new Error("바코드 또는 QR을 찾지 못했습니다.");
        }

        message.innerHTML =
          "✅ 바코드 / QR을 읽었습니다.";

        finishWithRawValue(decoded);

      } catch (error) {
        console.error(error);

        message.innerHTML =
          "⚠️ 사진에서 바코드 / QR을 찾지 못했습니다.<br>" +
          "라벨이 화면의 절반 이상 크게 보이도록 가까이 촬영해주세요.";

        showStatus(
          "다시 촬영해주세요",
          "QR 또는 바코드가 흔들리지 않고 선명하게 나오도록 촬영해주세요."
        );
      } finally {
        input.value = "";
      }
    }

    function loadImageFromFile(file) {
      return new Promise(function (resolve, reject) {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = function () {
          URL.revokeObjectURL(url);
          resolve(img);
        };

        img.onerror = function () {
          URL.revokeObjectURL(url);
          reject(new Error("사진을 불러오지 못했습니다."));
        };

        img.src = url;
      });
    }

    async function detectWithBarcodeDetector(source) {
      if (!("BarcodeDetector" in window)) return "";

      try {
        const supported =
          await BarcodeDetector.getSupportedFormats();

        const wanted = [
          "qr_code",
          "code_128",
          "code_39",
          "code_93",
          "codabar",
          "ean_13",
          "ean_8",
          "itf",
          "upc_a",
          "upc_e"
        ].filter(function (format) {
          return supported.includes(format);
        });

        if (!wanted.length) return "";

        const detector =
          new BarcodeDetector({ formats: wanted });

        const results =
          await detector.detect(source);

        if (results && results.length) {
          return String(results[0].rawValue || "").trim();
        }
      } catch (error) {
        console.log("BarcodeDetector:", error);
      }

      return "";
    }

    async function detectOriginalWithHtml5QrCode(file) {
      try {
        const scanner =
          new Html5Qrcode("photoReader", false);

        try {
          const result =
            await scanner.scanFile(file, true);

          return String(result || "").trim();
        } finally {
          try {
            await scanner.clear();
          } catch (e) {}
        }
      } catch (error) {
        console.log("html5-qrcode 원본:", error);
        return "";
      }
    }

    async function detectFromCrops(image) {
      const iw = image.naturalWidth || image.width;
      const ih = image.naturalHeight || image.height;

      // 라벨이 사진의 중앙 또는 중앙 아래/위에 있는 경우를 폭넓게 검사
      const crops = [
        [0.05, 0.20, 0.90, 0.60],
        [0.10, 0.30, 0.80, 0.45],
        [0.15, 0.35, 0.70, 0.35],
        [0.00, 0.00, 1.00, 1.00],
        [0.05, 0.05, 0.90, 0.45],
        [0.05, 0.50, 0.90, 0.45]
      ];

      for (let i = 0; i < crops.length; i++) {
        const c = crops[i];

        const sx = Math.floor(iw * c[0]);
        const sy = Math.floor(ih * c[1]);
        const sw = Math.max(1, Math.floor(iw * c[2]));
        const sh = Math.max(1, Math.floor(ih * c[3]));

        // 같은 영역을 일반/고대비 두 방식으로 시도
        for (let contrastPass = 0; contrastPass < 2; contrastPass++) {
          const canvas =
            renderCrop(
              image,
              sx, sy, sw, sh,
              contrastPass === 1
            );

          let result =
            await detectWithBarcodeDetector(canvas);

          if (result) return result;

          result =
            await detectCanvasWithHtml5QrCode(canvas);

          if (result) return result;
        }
      }

      return "";
    }

    function renderCrop(
      image,
      sx, sy, sw, sh,
      highContrast
    ) {
      const canvas =
        document.getElementById("workCanvas");

      const ctx =
        canvas.getContext("2d", {
          willReadFrequently: true
        });

      // 작은 QR/바코드를 확대해서 디코더에 전달
      const targetWidth = 1600;
      const scale = targetWidth / sw;
      const targetHeight =
        Math.max(300, Math.round(sh * scale));

      canvas.width = targetWidth;
      canvas.height = targetHeight;

      ctx.clearRect(
        0, 0,
        canvas.width,
        canvas.height
      );

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      ctx.drawImage(
        image,
        sx, sy, sw, sh,
        0, 0,
        canvas.width,
        canvas.height
      );

      if (highContrast) {
        const imageData =
          ctx.getImageData(
            0, 0,
            canvas.width,
            canvas.height
          );

        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          const gray =
            0.299 * data[i] +
            0.587 * data[i + 1] +
            0.114 * data[i + 2];

          // 단순 고대비 흑백화
          const value = gray > 150 ? 255 : 0;

          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      return canvas;
    }

    async function detectCanvasWithHtml5QrCode(canvas) {
      try {
        const blob =
          await new Promise(function (resolve) {
            canvas.toBlob(
              resolve,
              "image/jpeg",
              0.95
            );
          });

        if (!blob) return "";

        const file =
          new File(
            [blob],
            "scan.jpg",
            { type: "image/jpeg" }
          );

        const scanner =
          new Html5Qrcode("photoReader", false);

        try {
          const result =
            await scanner.scanFile(file, true);

          return String(result || "").trim();
        } finally {
          try {
            await scanner.clear();
          } catch (e) {}
        }
      } catch (error) {
        return "";
      }
    }

    function manualInput() {
      const input =
        prompt(
          "바코드 또는 QR 번호를 직접 입력해주세요."
        );

      if (input === null) return;

      const raw =
        String(input).trim();

      if (!raw) {
        alert(
          "바코드 또는 QR 번호를 입력해주세요."
        );
        return;
      }

      finishWithRawValue(raw);
    }

    function showStatus(title, value) {
      document
        .getElementById("statusTitle")
        .textContent = title;

      document
        .getElementById("statusValue")
        .innerHTML = value;

      document
        .getElementById("statusBox")
        .style.display = "block";
    }

    function hideStatus() {
      document
        .getElementById("statusBox")
        .style.display = "none";
    }

    function returnToWarehouse(barcode) {
      const url = new URL(returnUrl);

      url.searchParams.set("mode", mode);
      url.searchParams.set("employee", employee);
      url.searchParams.set("barcode", barcode);

      window.location.replace(
        url.toString()
      );
    }

    function cancelScan() {
      const url = new URL(returnUrl);

      if (employee) {
        url.searchParams.set(
          "employee",
          employee
        );
      }

      window.location.replace(
        url.toString()
      );
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
