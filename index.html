<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>창고 부품 강력 인식 스캐너</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    body { color: #fff; padding: 18px 14px 28px; }
    .wrap { width: 100%; max-width: 620px; margin: 0 auto; }
    h1 { margin: 12px 0 6px; text-align: center; font-size: 28px; }
    #modeText { text-align: center; font-size: 21px; font-weight: bold; margin-bottom: 8px; }
    #message { text-align: center; color: #ddd; font-size: 16px; line-height: 1.5; margin-bottom: 14px; }

    #reader {
      width: 100%;
      min-height: 280px;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      margin-bottom: 14px;
    }

    .button {
      display: block;
      width: 100%;
      min-height: 66px;
      margin-top: 12px;
      border: 0;
      border-radius: 17px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    #photoButton { background: #ff9800; color: #fff; }
    #manualButton { background: #f5f5f5; color: #222; }
    #backButton { background: #ddd; color: #222; }

    .inputCard {
      display: none;
      background: #fff;
      color: #222;
      padding: 18px;
      border-radius: 18px;
      margin-top: 12px;
    }
    #barcodeInput {
      width: 100%;
      min-height: 62px;
      padding: 10px 14px;
      border: 3px solid #bbb;
      border-radius: 13px;
      font-size: 20px;
      font-weight: bold;
      outline: none;
    }
    #confirmButton { background: #1976d2; color: #fff; }
    #closeManualButton { background: #eee; color: #222; }

    #statusBox {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-radius: 15px;
      background: #fff;
      color: #222;
      text-align: center;
      line-height: 1.5;
      word-break: break-all;
    }
    #statusTitle { font-size: 20px; font-weight: bold; margin-bottom: 7px; }
    #statusValue { font-size: 17px; font-weight: bold; }

    #busy {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.6;
    }
    .small { font-size: 14px; color: #aaa; text-align: center; margin-top: 8px; line-height: 1.45; }
  
  /* 현장용 빠른 버전: 자동 실시간 스캔 UI 숨김 */
  #reader, #cameraArea, #scanArea, .camera-area, .scan-area { display:none !important; }
</style>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  </head>

<body>
<div class="wrap">
  <h1>📷 바코드 / QR 강력 인식</h1>
  <div id="modeText">부품 확인</div>

  <div id="message">
    QR 전용 집중 인식 모드입니다.<br>
    사진에서 <b>QR처럼 생긴 영역만 찾아 확대·보정</b>해서 빠르게 분석합니다.
  </div>

  <div id="reader"></div>

  <button id="photoButton" class="button" type="button" onclick="choosePhoto()">
    📸 촬영해서 강력 인식
  </button>

  <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">

  <button id="manualButton" class="button" type="button" onclick="openManual()">
    ⌨️ 바코드 / QR 직접 입력
  </button>

  <div class="inputCard" id="inputCard">
    <input
      id="barcodeInput"
      type="text"
      inputmode="text"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      placeholder="예: K917568500034993 또는 +F..."
    >
    <button id="confirmButton" class="button" type="button" onclick="submitManual()">확인</button>
    <button id="closeManualButton" class="button" type="button" onclick="closeManual()">닫기</button>
  </div>

  <div id="statusBox">
    <div id="statusTitle"></div>
    <div id="statusValue"></div>
  </div>

  <div class="small"><b>QR 영역 집중 인식 v5</b><br>
    QR 원본번호가 +F로 시작하면 기존 회사 규칙대로 K번호로 자동 변환합니다.<br>
    OCR 결과는 자동 확정하지 않고 반드시 번호 확인 후 처리합니다.
  </div>

  <button id="backButton" class="button" type="button" onclick="cancelScan()">
    ← 창고관리로 돌아가기
  </button>
</div>

<div id="busy">QR코드만 빠르게 분석하고 있습니다.<br>원본 + 핵심 QR 보정만 확인합니다.</div>

<script>
const DEFAULT_RETURN_URL =
  "https://script.google.com/macros/s/AKfycbzz7fNk9x8N7NEll5wsNzjNKMiQ6qq3L-4lBaU3xT2JNaxE9LVgES8wNgW6_0DKKYHbrA/exec";

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode") || "test";
const employee = params.get("employee") || "";
const suppliedReturnUrl = params.get("returnUrl") || "";
const returnUrl = suppliedReturnUrl || DEFAULT_RETURN_URL;

let liveScanner = null;
let detected = false;
let busy = false;

window.addEventListener("load", async function () {
  setModeDisplay();

  const input = document.getElementById("barcodeInput");
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      submitManual();
    }
  });

  document.getElementById("photoInput").addEventListener("change", async function (event) {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (file) await analyzePhoto(file);
  });

  await startLiveScanner();
});

function setModeDisplay() {
  const el = document.getElementById("modeText");
  if (mode === "out") el.textContent = "📤 출고";
  else if (mode === "in") el.textContent = "📥 입고";
  else if (mode === "scan") el.textContent = "🔎 부품 확인";
  else if (mode === "number") el.textContent = "📷 번호 읽기";
  else el.textContent = "🧪 스캐너 테스트";
}

function convertCompanyBarcode(rawBarcode) {
  const result = String(rawBarcode || "").trim().toUpperCase();

  const map = {
    "0": "6", "1": "2", "2": "4", "3": "5", "4": "1",
    "5": "3", "6": "7", "7": "0", "8": "9", "9": "8"
  };

  if (result.startsWith("+F")) {
    const numbers = result.substring(2);
    let kCode = "K";
    for (let i = 0; i < numbers.length; i++) {
      kCode += map[numbers[i]] ?? numbers[i];
    }
    return kCode;
  }
  return result;
}

function normalizeRaw(value) {
  return String(value || "")
    .trim()
    .replace(/\s+/g, "")
    .replace(/[‐‑‒–—]/g, "-")
    .toUpperCase();
}

function looksUseful(value) {
  const s = normalizeRaw(value);
  return s.startsWith("+F") || /^K[0-9]{8,30}$/.test(s) || /^[0-9]{10,30}$/.test(s);
}

async function startLiveScanner() {
  if (busy || detected) return;

  try {
    liveScanner = new Html5Qrcode("reader");

    await liveScanner.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: function(w, h) {
          return {
            width: Math.floor(w * 0.88),
            height: Math.floor(Math.min(h * 0.55, w * 0.60))
          };
        },
        aspectRatio: 1.333333
      },
      async function(decodedText) {
        if (detected || busy) return;
        const raw = normalizeRaw(decodedText);
        if (!raw) return;
        detected = true;
        await stopLiveScanner();
        await acceptDetected(raw, "자동 QR 인식");
      },
      function() {}
    );
  } catch (e) {
    showStatus(
      "카메라 자동 인식 시작 실패",
      "촬영해서 강력 인식 또는 직접 입력을 사용해주세요."
    );
  }
}

async function stopLiveScanner() {
  if (!liveScanner) return;
  try { await liveScanner.stop(); } catch (e) {}
  try { await liveScanner.clear(); } catch (e) {}
  liveScanner = null;
}

function choosePhoto() {
  if (busy) return;
  document.getElementById("photoInput").click();
}

async function analyzePhoto(file) {
  if (busy) return;
  busy = true;
  detected = false;
  setBusy(true);
  await stopLiveScanner();

  try {
    const imageData = await loadImageData(file);

    // 1) 전체 사진은 빠르게 한 번씩만 확인
    const nativeValue = await tryBarcodeDetector(imageData.canvas);
    if (nativeValue) {
      setBusy(false); busy = false;
      await acceptDetected(nativeValue, "전체 사진 QR 인식");
      return;
    }

    const qrOriginal = tryJsQr(imageData.data, imageData.width, imageData.height);
    if (qrOriginal) {
      setBusy(false); busy = false;
      await acceptDetected(qrOriginal, "전체 사진 QR 인식");
      return;
    }

    // 2) 사진 전체를 무겁게 보정하지 않고,
    // QR처럼 검정/흰색 변화가 많은 작은 사각 영역을 찾아 우선 분석
    const regions = findQrLikeRegions(imageData.canvas, 8);

    for (let i = 0; i < regions.length; i++) {
      const r = regions[i];

      // QR 주변에 흰 여백을 붙이고 3배 확대
      const focused = makeFocusedQrCanvas(imageData.canvas, r, 3.0, 0.12);

      let value = await tryBarcodeDetector(focused.canvas);
      if (value) {
        setBusy(false); busy = false;
        await acceptDetected(value, "QR 영역 집중 인식");
        return;
      }

      const fd = focused.ctx.getImageData(0, 0, focused.canvas.width, focused.canvas.height);
      value = tryJsQr(fd, focused.canvas.width, focused.canvas.height);
      if (value) {
        setBusy(false); busy = false;
        await acceptDetected(value, "QR 영역 집중 인식");
        return;
      }

      // 상위 QR 후보만 핵심 보정 3종 추가
      if (i < 4) {
        const gray = toGray(fd);
        const stretch = contrastStretch(gray);
        const blur = gaussianBlur3x3(stretch, focused.canvas.width, focused.canvas.height);
        const sharp = unsharpMask(stretch, blur, 1.7, 0.7);

        const focusedVariants = [
          makeGrayVariant(stretch, focused.canvas.width, focused.canvas.height),
          makeGrayVariant(sharp, focused.canvas.width, focused.canvas.height),
          makeGrayVariant(
            adaptiveThreshold(sharp, focused.canvas.width, focused.canvas.height, 31, 5),
            focused.canvas.width, focused.canvas.height
          )
        ];

        for (const v of focusedVariants) {
          value = tryJsQr(v.data, v.width, v.height);
          if (!value) value = await tryBarcodeDetector(v.canvas);
          if (value) {
            setBusy(false); busy = false;
            await acceptDetected(value, "QR 영역 보정 인식");
            return;
          }
        }
      }

      // 휴대폰 화면이 멈춘 것처럼 보이지 않게 잠깐 양보
      if (i === 3) await new Promise(r => setTimeout(r, 0));
    }

    setBusy(false);
    busy = false;
    detected = false;
    alert(
      "QR코드를 인식하지 못했습니다.\n\n" +
      "QR코드가 사진 안에 들어오도록 다시 촬영해주세요."
    );

  } catch (e) {
    setBusy(false);
    busy = false;
    detected = false;
    alert("QR 분석 중 오류가 발생했습니다.\n\n" +
      (e && e.message ? e.message : String(e)));
  }
}
async function tryHtml5File(file) {
  const id = "tempFileQr_" + Date.now();
  const temp = document.createElement("div");
  temp.id = id;
  temp.style.display = "none";
  document.body.appendChild(temp);

  const scanner = new Html5Qrcode(id);
  try {
    const text = await scanner.scanFile(file, true);
    try { await scanner.clear(); } catch (e) {}
    temp.remove();
    return normalizeRaw(text);
  } catch (e) {
    try { await scanner.clear(); } catch (x) {}
    temp.remove();
    return "";
  }
}

function loadImageData(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);

    img.onload = function() {
      try {
        // Limit huge phone photos to keep processing stable.
        const maxSide = 1800;
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h);

        URL.revokeObjectURL(objectUrl);
        resolve({ canvas, ctx, data, width: w, height: h });
      } catch (e) {
        URL.revokeObjectURL(objectUrl);
        reject(e);
      }
    };

    img.onerror = function() {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("사진을 열 수 없습니다."));
    };

    img.src = objectUrl;
  });
}

async function tryBarcodeDetector(canvas) {
  if (!("BarcodeDetector" in window)) return "";
  try {
    const formats = await BarcodeDetector.getSupportedFormats();
    if (!formats.includes("qr_code")) return "";
    const detector = new BarcodeDetector({ formats: ["qr_code"] });
    const results = await detector.detect(canvas);
    if (results && results.length) {
      return normalizeRaw(results[0].rawValue || "");
    }
  } catch (e) {}
  return "";
}

function tryJsQr(imageData, width, height) {
  try {
    const result = jsQR(imageData.data, width, height, {
      inversionAttempts: "attemptBoth"
    });
    return result && result.data ? normalizeRaw(result.data) : "";
  } catch (e) {
    return "";
  }
}


function findQrLikeRegions(sourceCanvas, maxRegions) {
  // QR은 가로/세로 검정-흰색 전환이 모두 많은 정사각형 패턴이라는 점을 이용한다.
  // 사진을 겹치는 정사각 타일로 훑고 점수가 높은 영역만 골라낸다.
  const ctx = sourceCanvas.getContext("2d", { willReadFrequently: true });
  const w = sourceCanvas.width, h = sourceCanvas.height;
  const img = ctx.getImageData(0, 0, w, h);
  const gray = toGray(img);

  const side = Math.floor(Math.min(w, h) * 0.34);
  const step = Math.max(40, Math.floor(side * 0.52));
  const regions = [];

  for (let y = 0; y <= h - side; y += step) {
    for (let x = 0; x <= w - side; x += step) {
      const score = qrTextureScore(gray, w, h, x, y, side);
      regions.push({ x, y, w: side, h: side, score });
    }
  }

  // 오른쪽/아래 끝도 빠지지 않게 후보 추가
  const edgeXs = [0, Math.max(0, w - side)];
  const edgeYs = [0, Math.max(0, h - side)];
  for (const y of edgeYs) {
    for (const x of edgeXs) {
      regions.push({ x, y, w: side, h: side,
        score: qrTextureScore(gray, w, h, x, y, side) });
    }
  }

  regions.sort((a,b) => b.score - a.score);

  // 거의 같은 위치의 겹치는 후보 제거
  const picked = [];
  for (const r of regions) {
    const duplicate = picked.some(p => {
      const cx1 = r.x + r.w/2, cy1 = r.y + r.h/2;
      const cx2 = p.x + p.w/2, cy2 = p.y + p.h/2;
      return Math.hypot(cx1-cx2, cy1-cy2) < side * 0.35;
    });
    if (!duplicate) picked.push(r);
    if (picked.length >= maxRegions) break;
  }
  return picked;
}

function qrTextureScore(gray, imgW, imgH, x, y, side) {
  // 속도를 위해 모든 픽셀이 아니라 일정 간격으로 샘플링한다.
  const samples = 28;
  let hTransitions = 0, vTransitions = 0, dark = 0, total = 0;

  for (let j = 0; j < samples; j++) {
    const py = Math.min(imgH - 1, y + Math.floor((j + 0.5) * side / samples));
    let prev = null;
    for (let i = 0; i < samples; i++) {
      const px = Math.min(imgW - 1, x + Math.floor((i + 0.5) * side / samples));
      const v = gray[py * imgW + px] < 150 ? 1 : 0;
      dark += v; total++;
      if (prev !== null && v !== prev) hTransitions++;
      prev = v;
    }
  }

  for (let i = 0; i < samples; i++) {
    const px = Math.min(imgW - 1, x + Math.floor((i + 0.5) * side / samples));
    let prev = null;
    for (let j = 0; j < samples; j++) {
      const py = Math.min(imgH - 1, y + Math.floor((j + 0.5) * side / samples));
      const v = gray[py * imgW + px] < 150 ? 1 : 0;
      if (prev !== null && v !== prev) vTransitions++;
      prev = v;
    }
  }

  const darkRatio = total ? dark / total : 0;
  // 글자 한 줄보다 QR처럼 양방향 변화가 많은 곳에 높은 점수.
  const balance = Math.min(hTransitions, vTransitions);
  const densityBonus = (darkRatio > 0.08 && darkRatio < 0.62) ? 80 : 0;
  return balance * 2 + hTransitions + vTransitions + densityBonus;
}

function makeFocusedQrCanvas(sourceCanvas, r, scale, paddingRatio) {
  const pad = Math.floor(r.w * paddingRatio);
  const sx = Math.max(0, r.x - pad);
  const sy = Math.max(0, r.y - pad);
  const ex = Math.min(sourceCanvas.width, r.x + r.w + pad);
  const ey = Math.min(sourceCanvas.height, r.y + r.h + pad);
  const sw = Math.max(1, ex - sx);
  const sh = Math.max(1, ey - sy);

  // QR quiet-zone 역할을 하는 흰 여백을 별도로 추가
  const innerW = Math.floor(sw * scale);
  const innerH = Math.floor(sh * scale);
  const quiet = Math.max(24, Math.floor(Math.min(innerW, innerH) * 0.08));

  const canvas = document.createElement("canvas");
  canvas.width = innerW + quiet * 2;
  canvas.height = innerH + quiet * 2;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(sourceCanvas, sx, sy, sw, sh,
                quiet, quiet, innerW, innerH);
  return { canvas, ctx };
}

function buildRobustVariants(source) {
  const variants = [];
  const gray = toGray(source.data);
  const stretched = contrastStretch(gray);
  const blurred = gaussianBlur3x3(stretched, source.width, source.height);
  const sharp = unsharpMask(stretched, blurred, 1.7, 0.7);

  // 전체 사진: QR 형태 보존에 효과적인 핵심 후보만 사용
  variants.push(makeGrayVariant(gray, source.width, source.height));
  variants.push(makeGrayVariant(stretched, source.width, source.height));
  variants.push(makeGrayVariant(sharp, source.width, source.height));
  variants.push(makeGrayVariant(
    adaptiveThreshold(sharp, source.width, source.height, 31, 5),
    source.width, source.height
  ));
  variants.push(makeGrayVariant(
    adaptiveThreshold(sharp, source.width, source.height, 51, 7),
    source.width, source.height
  ));

  // QR이 작게 찍힌 경우를 위해 중앙 80%만 1.5배 확대하여 빠르게 재시도
  const crop = cropCenterCanvas(source.canvas, 0.80, 1.5);
  const cropData = crop.ctx.getImageData(0, 0, crop.canvas.width, crop.canvas.height);
  const cg = toGray(cropData);
  const cs = contrastStretch(cg);
  const cb = gaussianBlur3x3(cs, crop.canvas.width, crop.canvas.height);
  const csharp = unsharpMask(cs, cb, 1.7, 0.7);

  variants.push(makeGrayVariant(cs, crop.canvas.width, crop.canvas.height));
  variants.push(makeGrayVariant(csharp, crop.canvas.width, crop.canvas.height));
  variants.push(makeGrayVariant(
    adaptiveThreshold(csharp, crop.canvas.width, crop.canvas.height, 31, 5),
    crop.canvas.width, crop.canvas.height
  ));

  return variants;
}

function cropCenterCanvas(sourceCanvas, ratio, scale) {
  const sw = Math.max(1, Math.floor(sourceCanvas.width * ratio));
  const sh = Math.max(1, Math.floor(sourceCanvas.height * ratio));
  const sx = Math.floor((sourceCanvas.width - sw) / 2);
  const sy = Math.floor((sourceCanvas.height - sh) / 2);

  const canvas = document.createElement("canvas");
  canvas.width = Math.floor(sw * scale);
  canvas.height = Math.floor(sh * scale);
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return { canvas, ctx };
}
function toGray(imageData) {
  const src = imageData.data;
  const gray = new Uint8ClampedArray(imageData.width * imageData.height);
  for (let i = 0, p = 0; i < src.length; i += 4, p++) {
    gray[p] = Math.round(0.299 * src[i] + 0.587 * src[i+1] + 0.114 * src[i+2]);
  }
  return gray;
}

function contrastStretch(gray) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < gray.length; i++) hist[gray[i]]++;

  const total = gray.length;
  const lowTarget = total * 0.01;
  const highTarget = total * 0.99;

  let acc = 0, low = 0, high = 255;
  for (let i = 0; i < 256; i++) {
    acc += hist[i];
    if (acc >= lowTarget) { low = i; break; }
  }
  acc = 0;
  for (let i = 0; i < 256; i++) {
    acc += hist[i];
    if (acc >= highTarget) { high = i; break; }
  }

  if (high <= low) return new Uint8ClampedArray(gray);

  const out = new Uint8ClampedArray(gray.length);
  const scale = 255 / (high - low);
  for (let i = 0; i < gray.length; i++) {
    out[i] = Math.max(0, Math.min(255, Math.round((gray[i] - low) * scale)));
  }
  return out;
}

// 3x3 Gaussian kernel:
// 1 2 1
// 2 4 2  / 16
// 1 2 1
function gaussianBlur3x3(src, w, h) {
  const out = new Uint8ClampedArray(src.length);
  for (let y = 0; y < h; y++) {
    const ym = Math.max(0, y - 1);
    const yp = Math.min(h - 1, y + 1);
    for (let x = 0; x < w; x++) {
      const xm = Math.max(0, x - 1);
      const xp = Math.min(w - 1, x + 1);
      const sum =
        src[ym*w+xm] + 2*src[ym*w+x] + src[ym*w+xp] +
        2*src[y*w+xm] + 4*src[y*w+x] + 2*src[y*w+xp] +
        src[yp*w+xm] + 2*src[yp*w+x] + src[yp*w+xp];
      out[y*w+x] = Math.round(sum / 16);
    }
  }
  return out;
}

function unsharpMask(original, blurred, originalWeight, blurWeight) {
  const out = new Uint8ClampedArray(original.length);
  for (let i = 0; i < original.length; i++) {
    const v = originalWeight * original[i] - blurWeight * blurred[i];
    out[i] = Math.max(0, Math.min(255, Math.round(v)));
  }
  return out;
}

// Adaptive mean threshold using an integral image.
// This is the browser equivalent of the local-shadow compensation idea behind
// cv2.adaptiveThreshold, without depending on a fragile OpenCV.js build.
function adaptiveThreshold(gray, w, h, blockSize, C) {
  const r = Math.floor(blockSize / 2);
  const integral = new Float64Array((w + 1) * (h + 1));

  for (let y = 1; y <= h; y++) {
    let rowSum = 0;
    for (let x = 1; x <= w; x++) {
      rowSum += gray[(y - 1) * w + (x - 1)];
      integral[y * (w + 1) + x] =
        integral[(y - 1) * (w + 1) + x] + rowSum;
    }
  }

  const out = new Uint8ClampedArray(gray.length);

  for (let y = 0; y < h; y++) {
    const y1 = Math.max(0, y - r);
    const y2 = Math.min(h - 1, y + r);

    for (let x = 0; x < w; x++) {
      const x1 = Math.max(0, x - r);
      const x2 = Math.min(w - 1, x + r);

      const A = integral[y1 * (w + 1) + x1];
      const B = integral[y1 * (w + 1) + (x2 + 1)];
      const D = integral[(y2 + 1) * (w + 1) + x1];
      const E = integral[(y2 + 1) * (w + 1) + (x2 + 1)];

      const area = (x2 - x1 + 1) * (y2 - y1 + 1);
      const mean = (E - B - D + A) / area;
      const v = gray[y * w + x];

      out[y * w + x] = v > (mean - C) ? 255 : 0;
    }
  }

  return out;
}

function makeGrayVariant(gray, w, h) {
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const img = ctx.createImageData(w, h);

  for (let i = 0, p = 0; p < gray.length; p++, i += 4) {
    const v = gray[p];
    img.data[i] = v;
    img.data[i+1] = v;
    img.data[i+2] = v;
    img.data[i+3] = 255;
  }

  ctx.putImageData(img, 0, 0);
  return { canvas, data: img, width: w, height: h };
}

async function runOcrCandidates(originalCanvas, variants) {
  const targets = [originalCanvas];
  if (variants[0]) targets.push(variants[0].canvas);
  if (variants[1]) targets.push(variants[1].canvas);

  const found = new Set();

  for (const canvas of targets) {
    try {
      const result = await Tesseract.recognize(canvas, "eng", {
        logger: function() {}
      });

      const text = String(result.data && result.data.text ? result.data.text : "")
        .toUpperCase()
        .replace(/[ \t\r\n]/g, "");

      const kMatches = text.match(/K[0-9]{8,30}/g) || [];
      kMatches.forEach(v => found.add(v));

      // OCR may confuse K with other characters. Long digit sequences are shown
      // as K candidates, but still require explicit user confirmation.
      const digitMatches = text.match(/[0-9]{12,30}/g) || [];
      digitMatches.forEach(v => found.add("K" + v));

    } catch (e) {}
  }

  return Array.from(found).slice(0, 8);
}

async function askOcrCandidate(candidates) {
  let chosen = "";

  if (candidates.length === 1) {
    const candidate = candidates[0];
    const ok = confirm(
      "QR은 읽지 못했지만 인쇄된 번호를 문자로 인식했습니다.\n\n" +
      candidate +
      "\n\n⚠️ 흐린 숫자는 3/6/8/9 등이 틀릴 수 있습니다.\n" +
      "보드에 적힌 번호와 직접 비교해서 맞을 때만 확인을 눌러주세요."
    );
    if (ok) chosen = candidate;
  } else {
    const answer = prompt(
      "문자 인식 후보가 여러 개입니다.\n" +
      "보드에 적힌 번호와 비교해서 정확한 번호를 입력해주세요.\n\n" +
      candidates.map((v, i) => (i + 1) + ". " + v).join("\n"),
      candidates[0]
    );
    if (answer) chosen = normalizeRaw(answer);
  }

  if (!chosen) {
    detected = false;
    await restartLive();
    return;
  }

  await acceptDetected(chosen, "OCR 보조 인식");
}

async function acceptDetected(rawValue, source) {
  const raw = normalizeRaw(rawValue);
  if (!raw) {
    detected = false;
    await restartLive();
    return;
  }

  const converted = convertCompanyBarcode(raw);

  // Live/photo QR is also confirmed before an inventory action.
  const ok = confirm(
    source + "\n\n" +
    "인식 번호: " + raw + "\n" +
    "처리 번호: " + converted + "\n\n" +
    "이 번호가 맞습니까?"
  );

  if (!ok) {
    detected = false;
    await restartLive();
    return;
  }

  // 인식이 확정되면 모든 모드에서 K번호 자동 복사 시도
  let copied = false;
  try {
    await navigator.clipboard.writeText(converted);
    copied = true;
  } catch (e) {
    // 일부 모바일 브라우저에서는 클립보드 권한 때문에 실패할 수 있음.
    // 이 경우 아래 상태창에 번호를 그대로 표시해 수동 복사도 가능하게 유지.
  }

  showStatus(
    copied ? "✅ 인식 완료 · 번호 자동복사됨" : "✅ 인식 완료",
    escapeHtml(converted)
  );

  if (mode === "scan" || mode === "in" || mode === "out") {
    setTimeout(function() {
      returnToWarehouse(converted);
    }, 300);
    return;
  }

  if (mode === "number") {
    if (copied) {
      alert("✅ 번호가 자동으로 복사되었습니다.\n\n" + converted);
    } else {
      prompt("자동 복사가 차단되었습니다. 아래 번호를 복사해주세요.", converted);
    }
    cancelScan();
    return;
  }

  // test mode: keep result visible
  document.getElementById("barcodeInput").value = converted;
  detected = false;
}

function openManual() {
  document.getElementById("inputCard").style.display = "block";
  document.getElementById("barcodeInput").focus();
}

function closeManual() {
  document.getElementById("inputCard").style.display = "none";
}

async function submitManual() {
  const input = document.getElementById("barcodeInput");
  const raw = normalizeRaw(input.value);

  if (!raw) {
    alert("바코드 또는 QR 번호를 입력해주세요.");
    input.focus();
    return;
  }

  await stopLiveScanner();
  await acceptDetected(raw, "직접 입력");
}

function showStatus(title, value) {
  document.getElementById("statusTitle").textContent = title;
  document.getElementById("statusValue").innerHTML = value;
  document.getElementById("statusBox").style.display = "block";
}

function returnToWarehouse(barcode) {
  const url = new URL(returnUrl);
  url.searchParams.set("mode", mode);
  url.searchParams.set("employee", employee);
  url.searchParams.set("barcode", barcode);
  window.location.replace(url.toString());
}

function cancelScan() {
  const url = new URL(returnUrl);
  if (employee) url.searchParams.set("employee", employee);
  window.location.replace(url.toString());
}

async function restartLive() {
  if (mode === "test") return;
  await new Promise(r => setTimeout(r, 250));
  await startLiveScanner();
}

function setBusy(on) {
  document.getElementById("busy").style.display = on ? "flex" : "none";
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
