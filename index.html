<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>창고 부품 바코드 / QR 입력</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    body {
      color: #fff;
      padding: 24px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 18px 0 8px;
      text-align: center;
      font-size: 28px;
    }

    #modeText {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #message {
      text-align: center;
      font-size: 17px;
      line-height: 1.55;
      color: #ddd;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      width: 100%;
      min-height: 72px;
      margin: 12px 0;
      border: 0;
      border-radius: 18px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    #photoButton {
      background: #ff9800;
      color: #fff;
    }

    #manualButton {
      background: #fff;
      color: #222;
    }

    #backButton {
      background: #ddd;
      color: #222;
    }

    #statusBox {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border-radius: 16px;
      background: #fff;
      color: #222;
      text-align: center;
      line-height: 1.55;
      word-break: break-all;
    }

    #statusTitle {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #statusValue {
      font-size: 19px;
      font-weight: bold;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 42vh;
      object-fit: contain;
      margin: 18px 0 4px;
      border-radius: 14px;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>📦 바코드 / QR 입력</h1>

    <div id="modeText">부품 바코드 확인</div>

    <div id="message">
      촬영해서 스캔하거나<br>
      바코드 / QR 번호를 직접 입력해주세요.
    </div>

    <button id="photoButton" class="button" type="button"
      onclick="document.getElementById('photoInput').click()">
      📸 촬영으로 바코드 / QR 스캔
    </button>

    <input id="photoInput" type="file"
      accept="image/*"
      capture="environment"
      style="display:none"
      onchange="scanPhoto(this.files[0])">

    <button id="manualButton" class="button" type="button" onclick="manualInput()">
      ⌨️ 바코드 / QR 직접 입력
    </button>

    <button id="backButton" class="button" type="button" onclick="cancelScan()">
      ← 창고관리로 돌아가기
    </button>

    <img id="preview" alt="촬영 이미지 미리보기">

    <div id="statusBox">
      <div id="statusTitle"></div>
      <div id="statusValue"></div>
    </div>

  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const DEFAULT_RETURN_URL =
      "https://script.google.com/macros/s/AKfycbzz7fNk9x8N7NEll5wsNzjNKMiQ6qq3L-4lBaU3xT2JNaxE9LVgES8wNgW6_0DKKYHbrA/exec";

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") || "test";
    const employee = params.get("employee") || "";
    const suppliedReturnUrl = params.get("returnUrl") || "";
    const returnUrl = suppliedReturnUrl || DEFAULT_RETURN_URL;

    window.addEventListener("load", setModeDisplay);

    function setModeDisplay() {
      const modeText = document.getElementById("modeText");

      if (mode === "out") {
        modeText.textContent = "📤 출고";
      } else if (mode === "in") {
        modeText.textContent = "📥 입고";
      } else if (mode === "scan") {
        modeText.textContent = "🔎 부품 확인";
      } else {
        modeText.textContent = "🧪 스캔 테스트";
      }
    }

    function convertCompanyBarcode(rawBarcode) {
      const result = String(rawBarcode || "").trim();

      const map = {
        "0": "6",
        "1": "2",
        "2": "4",
        "3": "5",
        "4": "1",
        "5": "3",
        "6": "7",
        "7": "0",
        "8": "9",
        "9": "8"
      };

      if (result.startsWith("+F")) {
        const numbers = result.substring(2);
        let kCode = "K";

        for (let i = 0; i < numbers.length; i++) {
          kCode += map[numbers[i]] ?? numbers[i];
        }

        return kCode;
      }

      return result;
    }

    function finishWithRawValue(rawValue) {
      const raw = String(rawValue || "").trim();

      if (!raw) {
        showStatus("⚠️ 인식 실패", "읽은 값이 없습니다.");
        return;
      }

      const converted = convertCompanyBarcode(raw);

      showStatus(
        "✅ 인식 완료",
        "원본: " + raw + "<br>변환: " + converted
      );

      if (mode === "scan" || mode === "in" || mode === "out") {
        setTimeout(function () {
          returnToWarehouse(converted);
        }, 700);
      }
    }

    async function scanPhoto(file) {
      if (!file) return;

      const input = document.getElementById("photoInput");
      const message = document.getElementById("message");
      const preview = document.getElementById("preview");

      message.innerHTML = "📸 촬영한 사진을 분석하고 있습니다...";

      try {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";

        let decodedText = "";

        // 1차: 브라우저 기본 BarcodeDetector가 있으면 QR/바코드 판독 시도
        if ("BarcodeDetector" in window) {
          try {
            const formats = await BarcodeDetector.getSupportedFormats();

            const wanted = [
              "qr_code",
              "code_128",
              "code_39",
              "code_93",
              "codabar",
              "ean_13",
              "ean_8",
              "itf",
              "upc_a",
              "upc_e"
            ].filter(function (f) {
              return formats.includes(f);
            });

            if (wanted.length > 0) {
              const detector = new BarcodeDetector({ formats: wanted });
              const bitmap = await createImageBitmap(file);
              const results = await detector.detect(bitmap);

              if (results && results.length > 0) {
                decodedText = String(results[0].rawValue || "").trim();
              }

              if (bitmap.close) bitmap.close();
            }
          } catch (e) {
            console.log("BarcodeDetector 사진 판독:", e);
          }
        }

        // 2차: 위에서 못 읽으면 html5-qrcode의 사진 판독 사용
        if (!decodedText) {
          let holder = document.getElementById("photoReader");

          if (!holder) {
            holder = document.createElement("div");
            holder.id = "photoReader";
            holder.style.display = "none";
            document.body.appendChild(holder);
          }

          const photoScanner = new Html5Qrcode("photoReader", false);

          try {
            decodedText = await photoScanner.scanFile(file, true);
          } finally {
            try {
              await photoScanner.clear();
            } catch (e) {}
          }
        }

        if (!decodedText) {
          throw new Error("바코드 또는 QR을 찾지 못했습니다.");
        }

        message.innerHTML = "✅ 바코드 / QR을 읽었습니다.";
        finishWithRawValue(decodedText);

      } catch (error) {
        console.error(error);

        message.innerHTML =
          "⚠️ 사진에서 바코드 / QR을 찾지 못했습니다.<br>" +
          "코드가 크게 보이도록 가까이 촬영한 뒤 다시 시도해주세요.";

        showStatus(
          "다시 촬영해주세요",
          "QR 또는 바코드 전체가 선명하게 나오도록 촬영해주세요."
        );
      } finally {
        input.value = "";
      }
    }

    function manualInput() {
      const input = prompt("바코드 또는 QR 번호를 직접 입력해주세요.");

      if (input === null) return;

      const raw = String(input).trim();

      if (!raw) {
        alert("바코드 또는 QR 번호를 입력해주세요.");
        return;
      }

      finishWithRawValue(raw);
    }

    function showStatus(title, value) {
      document.getElementById("statusTitle").textContent = title;
      document.getElementById("statusValue").innerHTML = value;
      document.getElementById("statusBox").style.display = "block";
    }

    function returnToWarehouse(barcode) {
      const url = new URL(returnUrl);

      url.searchParams.set("mode", mode);
      url.searchParams.set("employee", employee);
      url.searchParams.set("barcode", barcode);

      window.location.replace(url.toString());
    }

    function cancelScan() {
      const url = new URL(returnUrl);

      if (employee) {
        url.searchParams.set("employee", employee);
      }

      window.location.replace(url.toString());
    }
  </script>
</body>
</html>
