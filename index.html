<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>창고 부품 바코드 스캐너</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    #scannerPage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #reader {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #reader__scan_region {
      background: transparent !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    #topArea {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding:
        calc(env(safe-area-inset-top) + 22px)
        18px
        18px
        18px;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0)
      );

      color: white;
      text-align: center;
      pointer-events: none;
    }

    #title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #modeText {
      display: inline-block;
      padding: 7px 15px;
      border-radius: 20px;
      background: rgba(255,255,255,0.18);
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #message {
      font-size: 17px;
      line-height: 1.5;
      text-shadow: 0 2px 4px #000;
    }

    #guideBox {
      position: absolute;
      z-index: 15;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 86%;
      max-width: 600px;
      height: 180px;

      border: 4px solid #ff2b2b;
      border-radius: 18px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.18),
        0 0 18px rgba(255,0,0,0.7);
    }

    #guideLine {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      background: #ff2b2b;
      box-shadow: 0 0 10px #ff0000;
    }

    #guideText {
      position: absolute;
      bottom: -48px;
      left: 0;
      right: 0;
      color: white;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      text-shadow: 0 2px 5px #000;
    }

    #bottomArea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;

      padding:
        20px
        22px
        calc(env(safe-area-inset-bottom) + 25px)
        22px;

      background: linear-gradient(
        to top,
        rgba(0,0,0,0.9),
        rgba(0,0,0,0)
      );
    }
#photoScanButton {
  display: block;
  width: 100%;
  min-height: 66px;

  margin-bottom: 14px;

  border: none;
  border-radius: 18px;

  background: #ff9800;
  color: white;

  font-size: 22px;
  font-weight: bold;

  cursor: pointer;
}
    #cancelButton {
      display: none;
      width: 100%;
      min-height: 66px;

      border: none;
      border-radius: 18px;

      background: rgba(255,255,255,0.92);
      color: #222;

      font-size: 22px;
      font-weight: bold;

      cursor: pointer;
    }

    #resultBox,
    #errorBox {
      display: none;

      position: fixed;
      z-index: 100;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: calc(100% - 36px);
      max-width: 560px;

      padding: 32px 24px;

      border-radius: 24px;

      background: white;
      color: #222;

      text-align: center;

      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    }

    #resultTitle {
      font-size: 29px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #resultBarcode {
      padding: 18px 12px;

      background: #f3f5f7;

      border-radius: 14px;

      font-size: 22px;
      font-weight: bold;

      word-break: break-all;

      margin-bottom: 15px;
    }

    #returnMessage {
      font-size: 18px;
      line-height: 1.5;
      color: #555;
    }

    .actionButton {
      width: 100%;
      min-height: 66px;

      margin-top: 22px;

      border: none;
      border-radius: 16px;

      font-size: 21px;
      font-weight: bold;

      cursor: pointer;
    }

    #rescanButton {
      background: #1976d2;
      color: white;
    }

    #backButton {
      background: #eeeeee;
      color: #222;
    }

    #errorTitle {
      font-size: 27px;
      font-weight: bold;
      color: #d32f2f;
      margin-bottom: 18px;
    }

    #errorMessage {
      font-size: 18px;
      line-height: 1.6;
      color: #333;
    }
  </style>
</head>

<body>

  <div id="scannerPage">

    <div id="reader"></div>

    <div id="topArea">

      <div id="title">
        📷 바코드 자동 스캔
      </div>

      <div id="modeText">
        바코드 스캔
      </div>

      <div id="message">
        원하는 부품의 바코드를<br>
        빨간 박스 중앙에 맞춰주세요
      </div>

    </div>

    <div id="guideBox">
      <div id="guideLine"></div>

      <div id="guideText">
        바코드를 빨간 선에 맞춰주세요
      </div>
    </div>

    <div id="bottomArea">
      <button
  id="photoScanButton"
  type="button"
  onclick="document.getElementById('photoInput').click()"
>
  📸 자동인식이 안되면 촬영으로 스캔
</button>

<input
  id="photoInput"
  type="file"
  accept="image/*"
  capture="environment"
  style="display:none"
  onchange="scanPhoto(this.files[0])"
>
      <button
        id="cancelButton"
        type="button"
        onclick="cancelScan()"
      >
        <button
  id="manualInputButton"
  type="button"
  onclick="manualInput()"
  style="
    display:block;
    width:100%;
    min-height:66px;
    margin-bottom:14px;
    border:none;
    border-radius:18px;
    background:#eeeeee;
    color:#222;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
  "
>
  ⌨️ 바코드 / QR 직접 입력
</button>
        
        ← 창고관리로 돌아가기
      </button>
    </div>

  </div>


  <div id="resultBox">

    <div id="resultTitle">
      ✅ 바코드 인식 성공
    </div>

    <div id="resultBarcode"></div>

    <div id="returnMessage"></div>

    <button
      id="rescanButton"
      class="actionButton"
      type="button"
      onclick="restartScanner()"
    >
      📷 다시 스캔
    </button>

  </div>


  <div id="errorBox">

    <div id="errorTitle">
      ⚠️ 카메라 실행 오류
    </div>

    <div id="errorMessage"></div>

    <button
      class="actionButton"
      id="rescanButton"
      type="button"
      onclick="restartScanner()"
    >
      다시 시도
    </button>

    <button
      class="actionButton"
      id="backButton"
      type="button"
      onclick="cancelScan()"
    >
      창고관리로 돌아가기
    </button>

  </div>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <script>

    /*************************************************
     * 창고관리 Apps Script 주소
     *************************************************/

    const DEFAULT_RETURN_URL =
      "https://script.google.com/macros/s/AKfycbzz7fNk9x8N7NEll5wsNzjNKMiQ6qq3L-4lBaU3xT2JNaxE9LVgES8wNgW6_0DKKYHbrA/exec";


    /*************************************************
     * 기본 변수
     *************************************************/

    let html5QrCode = null;

    let barcodeDetected = false;

    let scannerRunning = false;


    /*************************************************
     * URL에서 전달받은 값
     *************************************************/

    const params =
      new URLSearchParams(window.location.search);


    const mode =
      params.get("mode") || "test";


    const employee =
      params.get("employee") || "";


    const suppliedReturnUrl =
      params.get("returnUrl") || "";


    const returnUrl =
      suppliedReturnUrl || DEFAULT_RETURN_URL;


    /*************************************************
     * 화면 시작
     *************************************************/

    window.addEventListener(
      "load",
      function () {

        setModeDisplay();

        if (mode !== "test") {

          document
            .getElementById("cancelButton")
            .style.display = "block";

        }

        startScanner();

      }
    );


    /*************************************************
     * 모드 표시
     *************************************************/

    function setModeDisplay() {

      const modeText =
        document.getElementById("modeText");


      if (mode === "out") {

        modeText.textContent =
          "📤 출고 바코드 스캔";

      }

      else if (mode === "in") {

        modeText.textContent =
          "📥 입고 바코드 스캔";

      }

      else if (mode === "scan") {

        modeText.textContent =
          "📷 부품 바코드 확인";

      }

      else {

        modeText.textContent =
          "📷 자동스캔 테스트";

      }

    }


    /*************************************************
     * 카메라 시작
     *************************************************/

    async function startScanner() {

      barcodeDetected = false;


      hideResult();

      hideError();


      document
        .getElementById("guideBox")
        .style.display = "block";


      document
        .getElementById("message")
        .style.display = "block";


      try {

        if (!html5QrCode) {

          html5QrCode =
            new Html5Qrcode(
              "reader",
              false
            );

        }


        const config = {

          fps: 12,

          qrbox: function (
            viewfinderWidth,
            viewfinderHeight
          ) {

            let width =
              Math.floor(
                viewfinderWidth * 0.96
              );


            let height = 300;


            if (
              height >
              viewfinderHeight * 0.50
            ) {

              height =
                Math.floor(
                  viewfinderHeight * 0.30
                );

            }


            return {
              width: width,
              height: height
            };

          },

          disableFlip: true

        };


        await html5QrCode.start(

          {
            facingMode: "environment"
          },

          config,

          barcodeSuccess,

          function () {
            // 인식 실패 프레임은 무시
          }

        );


        scannerRunning = true;

      }

      catch (error) {

        scannerRunning = false;

        console.error(error);


        showError(
          "카메라를 실행하지 못했습니다.<br><br>" +
          "브라우저의 카메라 권한이 허용되어 있는지 확인한 후 다시 시도해주세요."
        );

      }

    }


    /*************************************************
     * 바코드 인식 성공
     *************************************************/

    async function barcodeSuccess(
      decodedText
    ) {

      if (barcodeDetected) {
        return;
      }


      barcodeDetected = true;


      const rawBarcode =
        String(decodedText || "").trim();


      if (!rawBarcode) {

        barcodeDetected = false;

        return;

      }


      const convertedBarcode =
        convertCompanyBarcode(
          rawBarcode
        );


      await stopScanner();


      showSuccess(
        convertedBarcode
      );


      /*
       * 창고관리 앱에서 호출된 경우에는
       * 잠시 성공 화면을 보여준 뒤
       * 원래 앱으로 자동 복귀한다.
       */

      if (
        mode === "scan" ||
        mode === "in" ||
        mode === "out"
      ) {

        setTimeout(
          function () {

            returnToWarehouse(
              convertedBarcode
            );

          },
          650
        );

      }

    }


    /*************************************************
     * 회사 바코드 변환
     *
     * 예:
     * +Fxxxxxxxx...
     * ↓
     * Kxxxxxxxx...
     *************************************************/

    function convertCompanyBarcode(
      rawBarcode
    ) {

      const result =
        String(
          rawBarcode || ""
        ).trim();


      const map = {

        "0": "6",
        "1": "2",
        "2": "4",
        "3": "5",
        "4": "1",

        "5": "3",
        "6": "7",
        "7": "0",
        "8": "9",
        "9": "8"

      };


      if (
        result.startsWith("+F")
      ) {

        const numbers =
          result.substring(2);


        let kCode = "K";


        for (
          let i = 0;
          i < numbers.length;
          i++
        ) {

          kCode +=
            map[numbers[i]]
            ?? numbers[i];

        }


        return kCode;

      }


      return result;

    }


    /*************************************************
     * 스캐너 정지
     *************************************************/

    async function stopScanner() {

      try {

        if (
          html5QrCode &&
          scannerRunning
        ) {

          await html5QrCode.stop();

        }

      }

      catch (error) {

        console.log(
          "스캐너 정지:",
          error
        );

      }


      scannerRunning = false;

    }


    /*************************************************
     * 성공 화면
     *************************************************/

    function showSuccess(
      barcode
    ) {

      document
        .getElementById("guideBox")
        .style.display = "none";


      document
        .getElementById("message")
        .style.display = "none";


      document
        .getElementById("resultBarcode")
        .textContent = barcode;


      const returnMessage =
        document.getElementById(
          "returnMessage"
        );


      if (
        mode === "scan" ||
        mode === "in" ||
        mode === "out"
      ) {

        returnMessage.innerHTML =
          "바코드를 확인했습니다.<br>" +
          "창고관리 화면으로 이동합니다...";


        document
          .getElementById("rescanButton")
          .style.display = "none";

      }

      else {

        returnMessage.innerHTML =
          "자동스캔 테스트가 정상적으로 작동했습니다.";


        document
          .getElementById("rescanButton")
          .style.display = "block";

      }


      document
        .getElementById("resultBox")
        .style.display = "block";

    }


    /*************************************************
     * 결과 화면 숨김
     *************************************************/

    function hideResult() {

      document
        .getElementById("resultBox")
        .style.display = "none";


      document
        .getElementById("rescanButton")
        .style.display = "block";

    }


    /*************************************************
     * 오류 화면
     *************************************************/

    function showError(
      message
    ) {

      document
        .getElementById("guideBox")
        .style.display = "none";


      document
        .getElementById("errorMessage")
        .innerHTML = message;


      document
        .getElementById("errorBox")
        .style.display = "block";

    }


    function hideError() {

      document
        .getElementById("errorBox")
        .style.display = "none";

    }


    /*************************************************
     * 다시 스캔
     *************************************************/

    async function restartScanner() {

      await stopScanner();

      barcodeDetected = false;

      setTimeout(
        startScanner,
        250
      );

    }


    /*************************************************
     * 창고관리 앱으로 복귀
     *************************************************/

    function returnToWarehouse(
      barcode
    ) {

      const url =
        new URL(returnUrl);


      url.searchParams.set(
        "mode",
        mode
      );


      url.searchParams.set(
        "employee",
        employee
      );


      url.searchParams.set(
        "barcode",
        barcode
      );


      /*
       * 스캐너 화면을 브라우저 기록에서
       * 교체하여 뒤로가기 혼선을 줄임
       */

      window.location.replace(
        url.toString()
      );

    }


    /*************************************************
     * 취소
     *************************************************/

    async function scanPhoto(file) {

  if (!file) {
    return;
  }

  try {

    // 자동스캔 카메라 잠시 정지
    await stopScanner();

    document.getElementById("message").innerHTML =
      "📸 촬영한 사진에서 바코드를 찾고 있습니다...";

    const photoScanner =
      new Html5Qrcode("reader");

    const decodedText =
      await photoScanner.scanFile(
        file,
        true
      );

    const convertedBarcode =
      convertCompanyBarcode(
        String(decodedText || "").trim()
      );

    if (!convertedBarcode) {
      throw new Error("바코드를 찾지 못했습니다.");
    }

    showSuccess(convertedBarcode);

    if (
      mode === "scan" ||
      mode === "in" ||
      mode === "out"
    ) {

      setTimeout(function () {

        returnToWarehouse(
          convertedBarcode
        );

      }, 650);

    }

  } catch (error) {

    console.error(error);

    document.getElementById("message").innerHTML =
      "⚠️ 사진에서 바코드를 찾지 못했습니다.<br>버튼을 눌러 다시 촬영해주세요.";

    document.getElementById("guideBox").style.display =
      "block";

  }

  // 같은 사진을 다시 선택할 수도 있게 초기화
  document.getElementById("photoInput").value = "";

}
    function manualInput() {

  const input = prompt(
    "바코드 또는 QR 번호를 직접 입력해주세요."
  );

  // 취소
  if (input === null) {
    return;
  }

  const rawBarcode =
    String(input).trim();

  // 빈칸
  if (!rawBarcode) {
    alert("바코드 또는 QR 번호를 입력해주세요.");
    return;
  }

  // 회사 바코드 형식이면 기존 방식대로 변환
  const convertedBarcode =
    convertCompanyBarcode(rawBarcode);

  if (!convertedBarcode) {
    alert("입력한 번호를 확인해주세요.");
    return;
  }

  // 창고관리 앱에서 들어온 경우
  if (
    mode === "scan" ||
    mode === "in" ||
    mode === "out"
  ) {

    returnToWarehouse(
      convertedBarcode
    );

    return;
  }

  // 테스트 모드일 경우
  showSuccess(
    convertedBarcode
  );
}
    
    async function cancelScan() {

      await stopScanner();


      if (
        mode === "test"
      ) {

        window.location.reload();

        return;

      }


      const url =
        new URL(returnUrl);


      if (employee) {

        url.searchParams.set(
          "employee",
          employee
        );

      }


      window.location.replace(
        url.toString()
      );

    }


    /*************************************************
     * 페이지 종료 시 카메라 정리
     *************************************************/

    window.addEventListener(
      "pagehide",
      function () {

        if (
          html5QrCode &&
          scannerRunning
        ) {

          html5QrCode
            .stop()
            .catch(function () {});

        }

      }
    );

  </script>

</body>
</html>
