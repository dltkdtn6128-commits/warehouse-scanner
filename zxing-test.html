<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZXing-WASM KT QR 테스트</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#111}
.wrap{max-width:560px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 16px #0001}
h2{margin-top:0}.btn{width:100%;padding:17px;border:0;border-radius:14px;font-size:18px;font-weight:700;background:#1268e8;color:#fff}
#photo{display:none}.status{margin-top:16px;padding:14px;border-radius:12px;background:#f2f4f7;word-break:break-all}
.result{font-size:22px;font-weight:800;margin-top:8px}.small{font-size:13px;color:#666;line-height:1.55;margin-top:12px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h2>📷 ZXing-C++ WASM QR 테스트</h2>
<p>KT 보드를 평소처럼 촬영해 주세요. <b>QR코드만</b> 읽습니다.</p>
<button class="btn" onclick="document.getElementById('photo').click()">📸 촬영해서 QR 인식</button>
<input id="photo" type="file" accept="image/*" capture="environment">
<div id="status" class="status">대기 중</div>
<div id="result" class="result"></div>
<div class="small">무료 ZXing-C++ WebAssembly 엔진 테스트 · OCR 사용 안 함 · QRCode 전용 · tryHarder 사용</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.1/dist/iife/reader/index.js"></script>
<script>
const input=document.getElementById('photo');
const statusEl=document.getElementById('status');
const resultEl=document.getElementById('result');

function convertCompanyCode(raw){
  let s=String(raw||'').trim();
  if(!s.startsWith('+F')) return s;
  const map={'0':'6','1':'2','2':'4','3':'5','4':'1','5':'3','6':'7','7':'0','8':'9','9':'8'};
  return 'K'+s.slice(2).split('').map(c=>map[c] ?? c).join('');
}

async function copyResult(v){
  try{await navigator.clipboard.writeText(v);return true}catch(e){return false}
}

async function decode(source, label){
  const opts={
    formats:['QRCode'],
    tryHarder:true,
    tryRotate:true,
    tryInvert:true,
    maxNumberOfSymbols:1
  };
  const results=await ZXingWASM.readBarcodes(source,opts);
  if(results && results.length && results[0].text){
    const raw=results[0].text.trim();
    const converted=convertCompanyCode(raw);
    const copied=await copyResult(converted);
    statusEl.textContent='✅ '+label+(copied?' · 자동복사됨':'');
    resultEl.textContent=converted;
    return true;
  }
  return false;
}

async function makeImageData(file,maxSide=1800){
  const bmp=await createImageBitmap(file);
  let w=bmp.width,h=bmp.height;
  const scale=Math.min(1,maxSide/Math.max(w,h));
  w=Math.round(w*scale);h=Math.round(h*scale);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(bmp,0,0,w,h);
  return {canvas:c,ctx:x,data:x.getImageData(0,0,w,h)};
}

function centerCrop(obj,ratio,scale){
  const sw=Math.floor(obj.canvas.width*ratio),sh=Math.floor(obj.canvas.height*ratio);
  const sx=Math.floor((obj.canvas.width-sw)/2),sy=Math.floor((obj.canvas.height-sh)/2);
  const c=document.createElement('canvas');c.width=Math.floor(sw*scale);c.height=Math.floor(sh*scale);
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  x.drawImage(obj.canvas,sx,sy,sw,sh,0,0,c.width,c.height);
  return x.getImageData(0,0,c.width,c.height);
}

input.addEventListener('change',async()=>{
  const file=input.files && input.files[0]; if(!file)return;
  resultEl.textContent=''; statusEl.textContent='⏳ ZXing-C++로 QR 분석 중...';
  try{
    // 1. 원본 파일 직접 분석
    if(await decode(file,'원본 QR 인식 성공')) return;

    // 2. 휴대폰 사진 크기를 안정적으로 축소한 ImageData
    const img=await makeImageData(file);
    if(await decode(img.data,'사진 QR 인식 성공')) return;

    // 3. 실제 KT 사진처럼 QR이 보드 중앙 부근에 있는 경우만 빠르게 확대 재시도
    statusEl.textContent='⏳ QR 중앙 영역 확대 재분석 중...';
    const crop1=centerCrop(img,0.82,1.8);
    if(await decode(crop1,'확대 QR 인식 성공')) return;

    const crop2=centerCrop(img,0.62,2.2);
    if(await decode(crop2,'집중 확대 QR 인식 성공')) return;

    statusEl.textContent='❌ QR 인식 실패';
    resultEl.textContent='번호를 추측하지 않습니다. 다시 촬영해 주세요.';
  }catch(e){
    statusEl.textContent='❌ 엔진 오류';
    resultEl.textContent=(e && e.message)?e.message:String(e);
  }finally{
    input.value='';
  }
});
</script>
</body>
</html>
